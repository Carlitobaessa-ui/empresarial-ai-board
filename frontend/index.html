<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisory & Governança</title>

    <!-- Anti-flash de tema: le a preferencia salva (ou a do sistema) e
         aplica a classe "dark" na tag <html> ANTES do primeiro paint, para
         que o splash estatico abaixo (e o app depois) ja nasçam no tema
         certo, sem piscar claro->escuro. Sincrono e minusculo de proposito. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("board_theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Paleta minima do splash, em variaveis CSS proprias (namespace
         separado das variaveis --color-* do bundle) para o splash continuar
         100% independente do CSS carregado pelo React - inclusive respeitando
         o tema claro/escuro. -->
    <style>
      :root {
        --splash-bg: #FAF9F5;
        --splash-surface: #FFFFFF;
        --splash-ink: #262624;
        --splash-ink-muted: #6B665D;
        --splash-accent: #D97757;
        --splash-accent-dark: #BC5F42;
        --splash-line: rgba(38, 38, 36, 0.10);
        --splash-line-strong: rgba(38, 38, 36, 0.14);
      }
      html.dark {
        --splash-bg: #1E1C1A;
        --splash-surface: #262421;
        --splash-ink: #F0ECE5;
        --splash-ink-muted: #9F988B;
        --splash-accent: #E08667;
        --splash-accent-dark: #CD7A5C;
        --splash-line: rgba(240, 236, 229, 0.12);
        --splash-line-strong: rgba(240, 236, 229, 0.16);
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @keyframes app-splash-spin-rev { to { transform: rotate(-360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Splash estatico: renderiza no primeiro paint, antes do bundle JS
         carregar/executar (o backend no plano gratuito do Render pode levar
         ate ~50s pra "acordar" na primeira chamada). CSS e SVG puros, sem
         Tailwind, para nao depender do bundle. Mesma linguagem visual dos
         icones do app: orbita/atomo de linha fina. Removido por main.jsx
         assim que o React termina de montar. -->
    <div id="app-splash" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--splash-bg);transition:opacity .35s ease;">
      <div style="position:relative;width:112px;height:112px;" aria-hidden="true">
        <div style="position:absolute;inset:0;border-radius:50%;border:1px dashed var(--splash-line-strong);animation:app-splash-spin-rev 14s linear infinite;"></div>
        <div style="position:absolute;inset:10px;border-radius:50%;border:1px solid var(--splash-line);animation:app-splash-spin 10s linear infinite;"></div>
        <div style="position:absolute;inset:6px;animation:app-splash-spin 4.5s linear infinite;">
          <span style="position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--splash-accent);"></span>
        </div>
        <div style="position:absolute;inset:6px;animation:app-splash-spin-rev 6.5s linear infinite;">
          <span style="position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--splash-accent-dark);"></span>
        </div>
        <div style="position:absolute;inset:18px;animation:app-splash-spin 3.2s linear infinite;">
          <span style="position:absolute;top:-2.5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--splash-ink-muted);"></span>
        </div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--splash-surface);border:1px solid var(--splash-line);display:flex;align-items:center;justify-content:center;animation:app-splash-spin 18s linear infinite;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--splash-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="12" rx="8.6" ry="3.3"/>
              <g transform="rotate(60 12 12)"><ellipse cx="12" cy="12" rx="8.6" ry="3.3"/></g>
              <g transform="rotate(120 12 12)"><ellipse cx="12" cy="12" rx="8.6" ry="3.3"/></g>
              <circle cx="12" cy="12" r="1.7" fill="var(--splash-ink)" stroke="none"/>
            </svg>
          </div>
        </div>
      </div>
      <div style="text-align:center;">
        <p style="font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-size:18px;color:var(--splash-ink);margin:0;">Advisory &amp; Governança</p>
        <p style="font-size:11px;color:var(--splash-ink-muted);margin:6px 0 0;letter-spacing:.03em;">Carregando...</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
