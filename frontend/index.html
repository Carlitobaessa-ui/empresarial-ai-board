<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisory & Governança</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Splash estatico: renderiza no primeiro paint, antes do bundle JS
         carregar/executar (o backend no plano gratuito do Render pode levar
         ate ~50s pra "acordar" na primeira chamada). CSS e SVG puros, sem
         Tailwind, para nao depender do bundle. Mesma linguagem visual dos
         icones do app: orbita/atomo de linha fina. Removido por main.jsx
         assim que o React termina de montar. -->
    <div id="app-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#FAF9F5;transition:opacity .35s ease;">
      <div style="position:relative;width:112px;height:112px;">
        <div style="position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(38,38,36,0.14);animation:app-splash-spin-rev 14s linear infinite;"></div>
        <div style="position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(38,38,36,0.10);animation:app-splash-spin 10s linear infinite;"></div>
        <div style="position:absolute;inset:6px;animation:app-splash-spin 4.5s linear infinite;">
          <span style="position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#D97757;"></span>
        </div>
        <div style="position:absolute;inset:6px;animation:app-splash-spin-rev 6.5s linear infinite;">
          <span style="position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#BC5F42;"></span>
        </div>
        <div style="position:absolute;inset:18px;animation:app-splash-spin 3.2s linear infinite;">
          <span style="position:absolute;top:-2.5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#6B665D;"></span>
        </div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div style="width:56px;height:56px;border-radius:50%;background:#FFFFFF;border:1px solid rgba(38,38,36,0.10);display:flex;align-items:center;justify-content:center;animation:app-splash-spin 18s linear infinite;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#262624" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="12" rx="8.6" ry="3.3"/>
              <g transform="rotate(60 12 12)"><ellipse cx="12" cy="12" rx="8.6" ry="3.3"/></g>
              <g transform="rotate(120 12 12)"><ellipse cx="12" cy="12" rx="8.6" ry="3.3"/></g>
              <circle cx="12" cy="12" r="1.7" fill="#262624" stroke="none"/>
            </svg>
          </div>
        </div>
      </div>
      <div style="text-align:center;">
        <p style="font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-size:18px;color:#262624;margin:0;">Advisory &amp; Governança</p>
        <p style="font-size:11px;color:#6B665D;margin:6px 0 0;letter-spacing:.03em;">Carregando...</p>
      </div>
    </div>
    <style>
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @keyframes app-splash-spin-rev { to { transform: rotate(-360deg); } }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
