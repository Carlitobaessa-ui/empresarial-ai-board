# Blueprint do Render (render.com) para o backend do Conselho de Agentes.
# No dashboard do Render: New + -> Blueprint -> selecione este repositório.
# O Render le este arquivo e cria o serviço automaticamente.
# As variaveis marcadas com "sync: false" precisam ser preenchidas a mao
# no dashboard do Render depois que o serviço for criado (Environment).
services:
  - type: web
    name: empresarial-ai-board-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
